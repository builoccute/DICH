name = "dich"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "dichthuat.wordbridge.io.vn/*", zone_name = "wordbridge.io.vn" }
]

[vars]
APP_NAME = "Dịch thuật Word Bridge"
APP_NAME_EN = "Word Bridge Translation"
SERVICE_CODE = "Trans"
PUBLIC_DOMAIN = "https://dichthuat.wordbridge.io.vn"
ECOSYSTEM_DOMAIN = "https://wordbridge.io.vn"
OFFICIAL_SUPPORT_EMAIL = "wordbridge.education@gmail.com"
ZERO_USER_DATA_STORAGE = "true"
MAX_TEXT_LENGTH = "15000"
MAX_DOCUMENT_BYTES = "52428800"
MAX_IMAGE_BYTES = "10485760"
MAX_DOCUMENT_PAGES = "50"
REQUEST_TIMEOUT = "20000"

[ai]
binding = "AI"

[[send_email]]
name = "SEND_EMAIL"
destination_address = "wordbridge.education@gmail.com"
